<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>GlslCanvas — sanity check</title>
  <script type="text/javascript" src="dist/GlslCanvas.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background:#101515; }
    #glslCanvas { width: 100vw; height: 100vh; display:block; }
  </style>
</head>
<body>
  <!-- 你的 canvas 保留即可：data-fragment-url 指向 readImage1DBlurFBO_yh.frag -->
  <canvas id="glslCanvas"
          data-fragment-url="readImage1DBlurFBO_yh.frag"
          data-textures="data/Waves_byChatGPT.png, data/Rice_byChatGPT.png"></canvas>
</body>
<script>
  const canvas = document.getElementById("glslCanvas");
  const sandbox = new GlslCanvas(canvas);
  // ✅ 不要再用 JS 設 width/height = '100%'，交給上面 CSS
</script>

</html>
