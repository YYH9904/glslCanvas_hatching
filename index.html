<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>GlslCanvas</title>
    <script type="text/javascript" src="dist/GlslCanvas.js"></script>
    <style>
        body {
            margin: 0;
            background: #101515;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh; /* 讓 body 撐滿視窗高度 */
        }
        #glslCanvas {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="glslCanvas" 
        data-fragment-url="Hatching_yh.frag" 
        width="600" height="800" 
        data-textures="data/Serenity by the Railroad Tracks.png, 
                       data/Hatch0.jpg, 
                       data/Hatch2.jpg, 
                       data/Hatch3.jpg, 
                       data/hatch_3.jpg, 
                       data/hatch_4.jpg, 
                       data/hatch_5.jpg"></canvas>
</body>
<script>
    var canvas = document.getElementById("glslCanvas");
    var sandbox = new GlslCanvas(canvas);
    var texCounter = 0;
    var sandbox_content = "";
    var sandbox_title = "";
    var sandbox_author = "";
    var sandbox_thumbnail = "";
    // 移除強制 canvas.style.width/height = 100%
</script>
</html>
